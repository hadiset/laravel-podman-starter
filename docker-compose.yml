version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laradocker
    volumes:
      - .:/var/www
    networks:
      - laranet
  
  web:
    image: docker.io/library/nginx:alpine
    container_name: laranginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - laranet

  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: larapg
    environment:
      POSTGRES_DB: larapg_db
      POSTGRES_USER: larapg
      POSTGRES_PASSWORD: larapg123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - laranet

networks:
  laranet:
    driver: bridge

volumes:
  pgdata: 
